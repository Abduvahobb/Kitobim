name: Telegram'dan darsliklarni olish
on:
  push:
    branches: [tg-darsliklar]

concurrency:
  group: kitoblar
  cancel-in-progress: false

jobs:
  tg:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_PASSWORD: ${{ secrets.TG_PASSWORD }}
      KANAL: talimxabarlari_fayllar
      IDLAR: '1-2700'
      FILTR: ''
      MIN_DATE: '2025-08-01'
      MANIFEST: tg-manifest-hammasi.json
      REGEX: '^(?!.*(qozoq|qirg|tojik|turkman|qqr|qoraqalpoq|\bkar\b|kazh|\btaj\b|\bturk\b|\bkyr\b|workbook|wokrbook|mashq|metodik)).*(uzb|o.zbek|_uz\b|\buz\b|rus|grade ?\d|student|rki|\d{1,2}[-_ ]?sinf)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet telethon cryptg
      - run: python tools/tg_yuklash.py
