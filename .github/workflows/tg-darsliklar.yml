name: Telegram'dan darsliklarni olish
on:
  push:
    branches: [tg-darsliklar]

concurrency:
  group: kitoblar
  cancel-in-progress: false

jobs:
  tg:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_PASSWORD: ${{ secrets.TG_PASSWORD }}
      KANAL: talimxabarlari_fayllar
      IDLAR: '674,681,688,695,702,703,705,712,747,754,761,762,764,771,671,673,556'
      FILTR: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet telethon cryptg
      - run: python tools/tg_yuklash.py
