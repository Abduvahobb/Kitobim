name: infoedu.uz darsliklar ro'yxati
# api.infoedu.uz dagi barcha darsliklar ro'yxatini olib, "kitoblar" release'iga infoedu.json bo'lib joylaydi.
on:
  push:
    branches: [infoedu]

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -q poppler-utils >/dev/null && pip install --quiet pillow
      - run: python3 tools/infoedu.py
      - if: always()
        run: gh release upload kitoblar infoedu-natija.json --clobber --repo "$GITHUB_REPOSITORY"
