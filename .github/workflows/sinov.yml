name: Asl faylni tekshirish
on:
  push:
    branches: [sinov]
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q poppler-utils ghostscript >/dev/null
      - run: |
          set +e
          curl -sfL -A 'Mozilla/5.0' -o a.pdf "https://api.infoedu.uz/wp-content/uploads/2026/10/5-sinf-tabiiy-fanlar.pdf"
          pdftoppm -f 30 -l 30 -r 30 -png a.pdf v0
          gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dCompatibilityLevel=1.6 -dPDFSETTINGS=/ebook -dColorImageResolution=150 -dGrayImageResolution=150 -dDetectDuplicateImages=true -sOutputFile=b1.pdf a.pdf
          pdftoppm -f 30 -l 30 -r 30 -png b1.pdf v1
          gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dCompatibilityLevel=1.6 -dPDFSETTINGS=/ebook -dColorImageResolution=150 -dGrayImageResolution=150 -dColorConversionStrategy=/LeaveColorUnchanged -dDetectDuplicateImages=true -dCompressFonts=true -sOutputFile=b2.pdf a.pdf
          pdftoppm -f 30 -l 30 -r 30 -png b2.pdf v2
          ls -la a.pdf b1.pdf b2.pdf
          for f in v*.png; do gh release upload kitoblar "$f" --clobber --repo "$GITHUB_REPOSITORY"; done
