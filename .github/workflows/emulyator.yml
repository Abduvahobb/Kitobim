name: Emulyatorda sinash
# Ilovani Android emulyatorida ishga tushirib, kitoblar ochilishini tekshiradi.
on:
  push:
    branches: [emulyator]

jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KITOBLAR: 'ingliz-tili-5-sinf-uz-yangi tabiiy-fanlar-5-sinf-uz-2024 matematika-5-sinf-uz-1-qism adabiyot-10-sinf-uz-2024 ingliz-tili-11-sinf-uz-2025 biologiya-7-sinf-uz-2022'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Debug APK
        run: |
          echo '{"books":{}}' > public/bundled.json
          npm ci || npm install
          npm run build
          npm i --no-save --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/
      - run: npm i --no-save --no-audit --no-fund playwright-core@1.47.2
      - name: Emulyator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n uz.kitobim.app/.MainActivity
            sleep 25
            S=$(adb shell cat /proc/net/unix | grep -o 'webview_devtools_remote_[0-9]*' | head -1); echo "socket: $S"
            adb forward tcp:9222 localabstract:$S
            node tools/emu-test.cjs $KITOBLAR 2>&1 | tee emu.log
            adb logcat -d | grep -iE 'Capacitor|Filesystem|chromium|WebViewLocal' | tail -150 > logcat.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu
          path: |
            emu.log
            logcat.txt
            emu-*.png
