name: Emulyatorda sinash
# Ilovani Android emulyatorida ishga tushirib, kitoblar ochilishini tekshiradi.
on:
  push:
    branches: [emulyator]

jobs:
  emu:
    strategy:
      fail-fast: false
      matrix:
        api: [34]
        bolak: [0, 58, 116, 174, 232, 290, 348, 406]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KITOBLAR: 'ALL:${{ matrix.bolak }}:58'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Debug APK
        run: |
          echo '{"books":{}}' > public/bundled.json
          npm ci || npm install
          npm run build
          npm i --no-save --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/
      - run: npm i --no-save --no-audit --no-fund ws@8.18.0
      - name: Emulyator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: bash tools/emu-run.sh
      - if: always()
        run: |
          set +e
          cp natija.txt natija-${{ matrix.bolak }}.txt
          gh release upload kitoblar natija-${{ matrix.bolak }}.txt --clobber --repo "$GITHUB_REPOSITORY"
          tail -5 emu.log
          true
