name: Kitob manzillarini tekshirish
on:
  push:
    branches: [tekshir]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tekshir.py
      - if: always()
        run: gh release upload kitoblar tekshir.json --clobber --repo "$GITHUB_REPOSITORY"
