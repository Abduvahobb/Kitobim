name: Manbalarni tekshirish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/probe.py', '.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probe.py
      - name: Natijani saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/report.json
          git commit -m "Manbalar tekshiruvi natijasi [skip ci]" && git pull --rebase origin main && git push origin HEAD:main || true
