name: Shubhali fayllarni ko'rish
on:
  push:
    branches: [kor]
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q poppler-utils >/dev/null && pip install --quiet pillow
      - run: python3 tools/kor_varaq.py tools/kor.txt && for f in varaq-*.png; do gh release upload kitoblar "$f" --clobber --repo "$GITHUB_REPOSITORY"; done
