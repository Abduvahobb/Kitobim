name: Ilovani yig'ish (Android + Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['tools/**', 'research/**', '.github/workflows/books.yml', 'README.md']

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Ilova ichiga joylanadigan kitoblar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          b = json.load(open('public/bundled.json'))['books']
          open('bundled.txt', 'w').write('\n'.join(f"{v.split('/')[-1]}" for v in b.values()) + '\n')
          PY
          mkdir -p public/books
          while read -r f; do
            if [ -n "$f" ]; then
              gh release download kitoblar --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir public/books --clobber
              echo "ichiga joylandi: $f ($(du -m public/books/$f | cut -f1) MB)"
            fi
          done < bundled.txt
          echo "ichiga joylangan kitoblar ro'yxati tayyor"
      - name: Veb-ilovani yig'ish
        run: |
          npm ci || npm install
          npm run build
      - name: Capacitor (Android loyihasi)
        run: |
          npm i --no-save --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@6 @capacitor/share@6
          npx cap add android
          npx cap sync android
      - name: Ikonka
        run: |
          python3 -m pip install --break-system-packages --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          img = Image.open('assets/icon.png').convert('RGBA')
          fg_src = Image.open('assets/icon-foreground.png').convert('RGBA')
          res = 'android/app/src/main/res'
          def circ(im):
              n = im.size[0]; m = Image.new('L', (n, n), 0); ImageDraw.Draw(m).ellipse((0, 0, n - 1, n - 1), fill=255)
              o = Image.new('RGBA', (n, n), (0, 0, 0, 0)); o.paste(im, (0, 0), m); return o
          for d, n in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              s = img.resize((n, n), Image.LANCZOS)
              s.save(f'{res}/mipmap-{d}/ic_launcher.png')
              circ(s).save(f'{res}/mipmap-{d}/ic_launcher_round.png')
              f = int(n * 108 / 48); fg = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              k = int(f * 80 / 108); ic = fg_src.resize((k, k), Image.LANCZOS)
              fg.paste(ic, ((f - k) // 2, (f - k) // 2), ic)
              fg.save(f'{res}/mipmap-{d}/ic_launcher_foreground.png')
          os.makedirs(f'{res}/mipmap-anydpi-v26', exist_ok=True)
          ad = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for nm in ['ic_launcher.xml', 'ic_launcher_round.xml']:
              open(f'{res}/mipmap-anydpi-v26/{nm}', 'w').write(ad)
          os.makedirs(f'{res}/values', exist_ok=True)
          open(f'{res}/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#16A085</color>\n</resources>\n')
          PY
      - name: Ochilish ekrani va status bar ranglari
        run: |
          python3 - <<'PY'
          import glob, os
          res = 'android/app/src/main/res'
          # Capacitor'ning standart ochilish rasmlari o'rniga: firma rangi + logotip + "Darsligim"
          for f in glob.glob(f'{res}/drawable*/splash.png'):
              os.remove(f)
          os.makedirs(f'{res}/drawable-xxhdpi', exist_ok=True)
          import shutil
          shutil.copy('assets/splash-mark.png', f'{res}/drawable-xxhdpi/splash_mark.png')
          open(f'{res}/drawable/splash.xml', 'w').write('''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/kitobim_brand"/>
              <item><bitmap android:gravity="center" android:src="@drawable/splash_mark"/></item>
          </layer-list>
          ''')
          open(f'{res}/values/kitobim_colors.xml', 'w').write('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="kitobim_brand">#16A085</color>
              <color name="kitobim_dark">#0F7A64</color>
          </resources>
          ''')
          open(f'{res}/values/styles.xml', 'w').write('''<?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">@color/kitobim_dark</item>
                  <item name="colorPrimaryDark">@color/kitobim_dark</item>
                  <item name="colorAccent">@color/kitobim_brand</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
                  <item name="colorPrimary">@color/kitobim_dark</item>
                  <item name="colorPrimaryDark">@color/kitobim_dark</item>
                  <item name="colorAccent">@color/kitobim_brand</item>
                  <item name="android:statusBarColor">@color/kitobim_dark</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightNavigationBar" tools:targetApi="27">true</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@drawable/splash</item>
                  <item name="windowSplashScreenBackground">@color/kitobim_brand</item>
                  <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
                  <item name="android:statusBarColor">@color/kitobim_brand</item>
              </style>
          </resources>
          ''')
          PY
      - name: APK yig'ish
        env:
          KS_B64: ${{ secrets.KITOBIM_KEYSTORE }}
          KS_PASS: ${{ secrets.KITOBIM_KEYSTORE_PASSWORD }}
          VCODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          mkdir -p ../out
          # Har bir versiya raqami oldingisidan katta bo'lishi kerak (ustidan yangilash uchun)
          cat >> app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv('VCODE') ?: '1') + 100
                  versionName '0.5.' + (System.getenv('VCODE') ?: '0')
              }
          }
          GRADLE
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            # Doimiy imzo kaliti: yangi versiya eski ilova ustidan o'rnatiladi, ma'lumotlar saqlanadi
            echo "$KS_B64" | base64 -d > app/kitobim.p12
            cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  kitobim {
                      storeFile file('kitobim.p12')
                      storePassword System.getenv('KS_PASS')
                      keyAlias 'kitobim'
                      keyPassword System.getenv('KS_PASS')
                      storeType 'pkcs12'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.kitobim
                      minifyEnabled false
                  }
              }
              lint {
                  checkReleaseBuilds false
              }
          }
          GRADLE
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../out/Darsligim.apk
          else
            echo "::warning::KITOBIM_KEYSTORE topilmadi — vaqtinchalik (debug) imzo ishlatildi"
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../out/Darsligim.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/Darsligim.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ilova ichiga joylanadigan kitoblar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/books
          for f in $(node -e "const b=require('./public/bundled.json').books;console.log(Object.values(b).map(v=>v.split('/').pop()).join(' '))"); do
            gh release download kitoblar --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir public/books --clobber
            echo "ichiga joylandi: $f"
          done
      - name: Veb-ilovani yig'ish
        run: |
          npm ci
          npm run build
      - name: Windows dasturini yig'ish
        shell: bash
        run: |
          cp -r dist desktop/web
          cp assets/icon.ico desktop/icon.ico
          cd desktop
          npm i --no-save --no-audit --no-fund electron@31 electron-builder@24
          npx electron-builder --win --publish never
          ls release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/Darsligim-Setup.exe
            desktop/release/Darsligim-portable.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Yuklab olish sahifasiga joylash (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R out
          gh release create "v0.5.${{ github.run_number }}" \
            out/android/Darsligim.apk out/windows/Darsligim-Setup.exe out/windows/Darsligim-portable.exe \
            --title "Darsligim v0.5.${{ github.run_number }}" \
            --notes "Android uchun: Darsligim.apk. Kompyuter uchun: Darsligim-Setup.exe (o'rnatiladigan) yoki Darsligim-portable.exe (o'rnatmasdan ishlaydi)." \
            --latest --repo "$GITHUB_REPOSITORY"
