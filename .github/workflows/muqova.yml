name: Darslik muqovalari va nashr yillari
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/muqova.py', '.github/workflows/muqova.yml']

concurrency:
  group: kitoblar
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - run: python tools/muqova.py
      - name: Saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers tools/muqova.json
          git commit -m "Darslik muqovalari va nashr yillari [skip ci]" && git pull --rebase origin main && git push origin HEAD:main || true
